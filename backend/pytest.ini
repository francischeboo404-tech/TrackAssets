[pytest]
filterwarnings =
    # Suppress noisy third-party deprecation warnings during test runs
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # SQLAlchemy SAWarnings (numeric/engine warnings during sqlite tests)
    ignore::sqlalchemy.exc.SAWarning
    # Specific Flask-SQLAlchemy internal deprecation
    ignore:.*'_app_ctx_stack' is deprecated.*:DeprecationWarning:flask_sqlalchemy.*
    ignore:.*'_app_ctx_stack' is deprecated and will be removed in Flask 2.4.*:DeprecationWarning:flask_sqlalchemy.*
