[pytest]
filterwarnings =
    # Global suppression for test runs (reduces noise from third-party libs)
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::sqlalchemy.exc.SAWarning
    # Keep a targeted exception for Flask-SQLAlchemy internals
    ignore:.*'_app_ctx_stack' is deprecated.*:DeprecationWarning:flask_sqlalchemy.*
    ignore:.*'_app_ctx_stack' is deprecated and will be removed in Flask 2.4.*:DeprecationWarning:flask_sqlalchemy.*
